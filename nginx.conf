server {
    listen 8080;
    server_name _;

    # Sous-requête pour valider l'authentification (cookie)
    location = /verify-auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/check-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Route principale protégée
    location / {
        auth_request /verify-auth;
        
        # Si l'auth_request échoue (401), Nginx attrape l'erreur et redirige vers /login
        error_page 401 = @error401;

        # Si authentifié, on sert noVNC
        root /usr/share/novnc;
        try_files $uri $uri/ /vnc.html;
    }

    # Redirection propre vers la page de login Node.js
    location @error401 {
        return 302 /login;
    }

    # Proxy pour le WebSocket noVNC (websockify)
    location /websockify {
        auth_request /verify-auth;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 61s;
        proxy_send_timeout 61s;
    }

    # Routes gérées par Node.js (/login, /api/login, /api/check-auth)
    location ~ ^/(login|api/) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
