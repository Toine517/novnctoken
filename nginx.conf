server {
    listen 8080;
    server_name _;

    root /usr/share/novnc;
    index vnc.html;

    # Sous-requête pour valider l'accès (token ou cookie)
    location = /verify-auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/check-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Route protégée menant à noVNC
    location / {
        auth_request /verify-auth;
        
        # Redirection vers websockify / noVNC local
        try_files $uri $uri/ /vnc.html;
    }

    # Proxy pour le WebSocket noVNC (websockify)
    location /websockify {
        auth_request /verify-auth;
        proxy_pass http://127.0.0.1:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 61s;
        proxy_send_timeout 61s;
    }

    # Route pour l'API Node.js (login / génération de token)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
